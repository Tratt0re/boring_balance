@if (isLoading()) {
  <z-skeleton class="h-12 w-full"></z-skeleton>
  <z-skeleton class="h-52 w-full"></z-skeleton>
} @else if (loadError(); as loadError) {
  <div role="alert" class="rounded-md border border-destructive/30 bg-destructive/5 p-4 text-sm text-destructive">
    {{ 'accounts.archivedDialog.errors.loadFailed' | translate: { error: loadError } }}
  </div>
} @else {
  <app-data-table
    [data]="accounts()"
    [structure]="tableStructure"
    emptyMessage="accounts.archivedDialog.emptyMessage"
    minHeight="220px"
    maxHeight="55dvh"
    [appearance]="'default'"
    [showEmpty]="true"
    [hoverable]="true"
    [selectable]="false"
    [stickyHeader]="true"
    [hasActionColumn]="false"
    [showPagination]="false"
  ></app-data-table>
}
